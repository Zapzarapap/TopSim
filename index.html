<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOPSIM Spielwiese – Planung Periode 2</title>
<style>
  :root {
    --blau: #0b5fa5; --blau-hell: #e8f1fa; --text: #1d2733; --grau: #6b7684; --linie: #dde3ea; --bg: #f5f7fa; --weiss: #fff;
    --gruen: #2e8b57; --gelb: #d49a00; --rot: #c8382e; --ein: #0b5fa5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); background: var(--bg); }
  header { background: var(--blau); color: #fff; padding: 10px 18px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .sub { opacity: .85; font-size: 13px; }
  header .legende { margin-left: auto; display: flex; gap: 12px; font-size: 12px; flex-wrap: wrap; }
  header .legende span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  .d0 { background: var(--gruen); } .d1 { background: var(--gelb); } .d2 { background: var(--rot); } .dein { background: var(--ein); }
  header .dot { border: 1.5px solid #fff; }
  .layout { display: grid; grid-template-columns: 390px 1fr; gap: 16px; padding: 16px; align-items: start; }
  @media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--weiss); border: 1px solid var(--linie); border-radius: 8px; }
  .formular { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
  .ftabs { display: flex; border-bottom: 1px solid var(--linie); position: sticky; top: 0; background: #fff; z-index: 2; }
  .ftabs button { flex: 1; border: 0; background: none; padding: 9px 4px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--grau); border-bottom: 3px solid transparent; }
  .ftabs button.akt { color: var(--blau); border-bottom-color: #e08a00; font-weight: 600; }
  .fbody { padding: 6px 14px 14px; }
  .fgruppe { margin-top: 12px; }
  .fgruppe h3 { font-size: 12px; letter-spacing: .04em; color: var(--blau); margin: 0 0 4px; border-bottom: 1px solid var(--blau); padding-bottom: 3px; text-transform: uppercase; }
  .feld { display: grid; grid-template-columns: 1fr 120px; gap: 8px; align-items: center; padding: 3px 0; }
  .feld label { font-size: 13px; }
  .feld .einh { color: var(--grau); font-size: 11.5px; }
  .feld input[type=number] { width: 100%; padding: 4px 6px; border: 1px solid #c7d0da; border-radius: 4px; font: inherit; text-align: right; }
  .feld input.geaendert { background: #fff6e0; border-color: #e0b04a; }
  .feld .vp { grid-column: 1 / -1; font-size: 11px; color: var(--grau); margin-top: -3px; }
  .typen { display: grid; grid-template-columns: 1fr 70px 70px 70px; gap: 5px; align-items: center; font-size: 12.5px; }
  .typen input { width: 100%; padding: 3px 4px; border: 1px solid #c7d0da; border-radius: 4px; text-align: right; font: inherit; }
  .typen .kopf { font-weight: 600; text-align: center; font-size: 12px; }
  .ann .feld { grid-template-columns: 14px 1fr 100px; }
  .ann .hinw { grid-column: 2 / -1; font-size: 11px; color: var(--grau); margin-top: -3px; }
  .knoepfe { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .knopf { border: 1px solid var(--blau); background: #fff; color: var(--blau); padding: 6px 10px; border-radius: 5px; cursor: pointer; font: inherit; font-size: 12.5px; }
  .knopf.voll { background: var(--blau); color: #fff; }
  .inhalt { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .kacheln { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; }
  .kachel { background: #fff; border: 1px solid var(--linie); border-radius: 8px; padding: 9px 11px; cursor: pointer; position: relative; }
  .kachel:hover { border-color: var(--blau); }
  .kachel .l { font-size: 12px; color: var(--grau); display: flex; gap: 6px; align-items: center; }
  .kachel .w { font-size: 21px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kachel .s { font-size: 11.5px; color: var(--grau); }
  .kachel.warn { border-left: 4px solid var(--rot); }
  .kachel.ok { border-left: 4px solid var(--gruen); }
  .kachel.mittel { border-left: 4px solid var(--gelb); }
  .box { padding: 12px 14px; }
  .box h2 { font-size: 15px; margin: 0 0 8px; }
  .hinweise { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
  .hinweise li { padding: 6px 9px; border-radius: 5px; font-size: 13px; display: flex; gap: 8px; }
  .hinweise li.rot { background: #fdecea; } .hinweise li.gelb { background: #fff6e0; } .hinweise li.gruen { background: #eaf6ef; } .hinweise li.info { background: var(--blau-hell); }
  .tabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--linie); padding: 0 8px; }
  .tabs button { border: 0; background: none; padding: 9px 10px; font: inherit; font-size: 13px; cursor: pointer; color: var(--grau); border-bottom: 3px solid transparent; }
  .tabs button.akt { color: var(--blau); border-bottom-color: var(--blau); font-weight: 600; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { padding: 4px 8px; border-bottom: 1px solid #edf0f3; text-align: right; font-size: 13px; }
  th:first-child, td:first-child { text-align: left; }
  th { font-weight: 600; color: var(--grau); font-size: 12px; background: #fafbfc; }
  tr.klick { cursor: pointer; } tr.klick:hover td { background: var(--blau-hell); }
  tr.summe td { font-weight: 600; border-top: 1px solid #c7d0da; }
  tr.zwischen td { background: #fafbfc; font-weight: 600; }
  td .dot { margin-right: 6px; vertical-align: middle; }
  .pos { color: var(--gruen); } .neg { color: var(--rot); }
  .klein { font-size: 12px; color: var(--grau); }
  .zwei { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; } @media (max-width: 1300px) { .zwei { grid-template-columns: 1fr; } }
  /* Rechenweg */
  .rw-hg { position: fixed; inset: 0; background: rgba(20, 30, 45, .25); display: none; z-index: 20; }
  .rw { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: #fff; z-index: 21; box-shadow: -4px 0 18px rgba(0,0,0,.15); display: none; flex-direction: column; }
  .rw.offen, .rw-hg.offen { display: flex; }
  .rw-kopf { padding: 12px 16px; border-bottom: 1px solid var(--linie); display: flex; gap: 10px; align-items: flex-start; }
  .rw-kopf h2 { margin: 0; font-size: 16px; flex: 1; }
  .rw-kopf button { border: 0; background: none; font-size: 22px; cursor: pointer; color: var(--grau); line-height: 1; }
  .rw-body { padding: 14px 16px; overflow: auto; }
  .rw-wert { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .rw-abschnitt { margin-top: 14px; }
  .rw-abschnitt h4 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--grau); }
  .formel { background: #f3f6f9; border-radius: 5px; padding: 8px 10px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12.5px; white-space: pre-wrap; word-break: break-word; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #f0f3f6; margin-right: 6px; }
  .pfad { font-size: 12px; color: var(--grau); margin-bottom: 8px; }
  .pfad a { color: var(--blau); cursor: pointer; text-decoration: underline; }
  .balken { margin-top: 6px; }
  .balken .zeile { display: grid; grid-template-columns: 190px 1fr 80px; gap: 8px; align-items: center; margin: 5px 0; font-size: 12.5px; }
  .balken .spur { position: relative; height: 16px; background: #f0f3f6; border-radius: 3px; }
  .balken .b { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
  .balken .wert { text-align: right; font-variant-numeric: tabular-nums; }
  .hinweisbox { background: var(--blau-hell); border-radius: 6px; padding: 8px 11px; font-size: 13px; margin: 8px 0; }
  .warnbox { background: #fdecea; border-radius: 6px; padding: 8px 11px; font-size: 13px; margin: 8px 0; }
  details summary { cursor: pointer; color: var(--blau); font-size: 13px; }
</style>
</head>
<body>
<header>
  <div><h1>TOPSIM Spielwiese · Planung Periode 2</h1><div class="sub">Unternehmen 1 · Copy Classic · Ausgangslage: Sammelbericht Periode 1</div></div>
  <div class="legende">
    <span><i class="dot d0"></i>Spielregel / Ist-Wert</span>
    <span><i class="dot d1"></i>aus Berichten abgeleitet</span>
    <span><i class="dot d2"></i>Schätzung (Nachfrage, Konkurrenz)</span>
    <span><i class="dot dein"></i>eure Eingabe</span>
  </div>
</header>
<div class="layout">
  <aside class="panel formular" id="formular"></aside>
  <main class="inhalt">
    <div class="kacheln" id="kacheln"></div>
    <div class="panel box"><h2>Hinweise</h2><ul class="hinweise" id="hinweise"></ul></div>
    <div class="panel"><div class="tabs" id="tabs"></div><div class="box" id="tabinhalt"></div></div>
  </main>
</div>
<div class="rw-hg" id="rwhg"></div>
<aside class="rw" id="rw"><div class="rw-kopf"><h2 id="rwtitel"></h2><button id="rwzu" aria-label="Schließen">×</button></div><div class="rw-body" id="rwbody"></div></aside>
<script type="module" src="app.js"></script>
</body>
</html>
