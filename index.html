<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TOPSIM Spielwiese</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0d1416);--ink:light-dark(#14161a,#e7eceb);--mute:light-dark(#5d6670,#9aa7a8);--line:light-dark(#d9dee2,#26343a);--panel:light-dark(#f4f7f7,#13201f);--teal:light-dark(#0b5d63,#5fc3c9);--tealbg:light-dark(#e3f0f0,#12302f);--in:light-dark(#fffbe0,#2a2a14);
--g:light-dark(#2e7d32,#7ccf80);--gbg:light-dark(#e4f2e4,#13301a);--y:light-dark(#8a6100,#f0c95a);--ybg:light-dark(#fff3cd,#3a3010);--r:light-dark(#b3261e,#ff8a80);--rbg:light-dark(#fbe2df,#3d1715)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;overflow-x:clip}
header{background:var(--teal);color:#fff;padding:18px max(3vw,16px) 16px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between}
@media(prefers-color-scheme:dark){header{color:#0d1416}}
h1{font:700 clamp(28px,3.4vw,40px)/1.05 "Libre Caslon Text",Georgia,serif;margin:0;letter-spacing:-.02em}
.sub{font-size:14px;opacity:.9;margin-top:4px}
.bar{display:flex;flex-wrap:wrap;gap:8px}
button{font:600 14px Inter,sans-serif;min-height:40px;padding:8px 14px;border-radius:8px;border:1px solid currentColor;background:transparent;color:inherit;cursor:pointer}
button:hover{background:color-mix(in srgb,currentColor 12%,transparent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--y);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:24px;padding:20px max(3vw,16px) 40px;max-width:1480px;margin:0 auto}
.form section,.form details{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;background:var(--bg)}
.form h2{font:600 13px Inter,sans-serif;margin:0;padding:8px 12px;background:var(--tealbg);color:var(--teal);border-radius:10px 10px 0 0}
.row{display:grid;grid-template-columns:minmax(0,1fr) 120px 52px;gap:8px;align-items:center;padding:5px 12px;border-top:1px solid var(--line)}
.row.t{grid-template-columns:minmax(0,1fr) repeat(3,64px)}
.row label{font-size:14px}
.row .u{font-size:13px;color:var(--mute)}
.row.head{font-size:13px;color:var(--mute);font-weight:600}
.src{display:block;font-size:12px;color:var(--mute)}
.src.est{color:var(--y)}
input,select{font:16px Inter,sans-serif;width:100%;min-height:36px;padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--in);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
select{text-align:left}
input.chg,select.chg{border-color:var(--teal);box-shadow:inset 3px 0 0 var(--teal)}
details summary{cursor:pointer;padding:10px 12px;font-weight:600;font-size:14px}
.res{display:grid;gap:14px;align-content:start}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;padding:18px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.big .k{font-size:13px;color:var(--mute)}
.big .v{font:700 clamp(36px,4.6vw,56px)/1 "Libre Caslon Text",Georgia,serif;letter-spacing:-.02em;white-space:nowrap}
.big .d{font-weight:600;margin-top:6px;white-space:nowrap}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.trio div{font-size:13px;color:var(--mute)}.trio b{display:block;font-size:19px;color:var(--ink);white-space:nowrap}.trio small{font-size:13px;font-weight:500}
.meter{margin-bottom:12px}.meter .lab{display:flex;justify-content:space-between;font-size:13px}
.track{position:relative;height:18px;border-radius:4px;background:var(--bg);border:1px solid var(--line);margin-top:4px;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;background:var(--teal);transition:width .25s}
.mk{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}.mk.r{background:var(--r)}
.amps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.amp{border-radius:8px;padding:8px 10px;font-size:13px;border:1px solid var(--line)}
.amp b{display:block;font-size:13px}
.amp.G{background:var(--gbg)}.amp.G b{color:var(--g)}.amp.Y{background:var(--ybg)}.amp.Y b{color:var(--y)}.amp.R{background:var(--rbg)}.amp.R b{color:var(--r)}
.card{border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h3{font:600 15px Inter,sans-serif;margin:0 0 8px}
.chg-list{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(13em,1fr));gap:4px 16px}
.chg-list li{display:flex;justify-content:space-between;gap:8px;font-size:14px;border-bottom:1px dotted var(--line);padding:3px 0}
.pos{color:var(--g)}.neg{color:var(--r)}.mute{color:var(--mute)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;white-space:normal}
#tab td:first-child{min-width:16em;max-width:30em}
th{font-size:13px;color:var(--mute);font-weight:600;vertical-align:bottom}
td.note,th.note{text-align:left;white-space:normal;font-size:13px;color:var(--mute);min-width:16em}
tr.sum td{font-weight:600}
tr.bad td{background:var(--ybg)}
.pw{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pw div{font-size:13px;color:var(--mute)}.pw b{display:block;font-size:18px;color:var(--ink);white-space:nowrap}
.note{font-size:13px;color:var(--mute)}
.msg{font-size:14px;padding:8px 12px;border-radius:8px;background:var(--tealbg);margin:12px max(3vw,16px) 0;display:none}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tabs button{min-height:36px;padding:6px 12px;border-color:var(--line);color:var(--ink)}
.tabs button[aria-selected=true]{background:var(--teal);border-color:var(--teal);color:#fff}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.sc th:nth-child(3),.sc td:nth-child(3){background:var(--panel)}
@media(max-width:1100px){.amps{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:minmax(0,1fr)}}
@media(max-width:900px){main{grid-template-columns:minmax(0,1fr)}.res{order:-1}}
@media(max-width:600px){.hero{grid-template-columns:minmax(0,1fr)}.pw{grid-template-columns:repeat(2,minmax(0,1fr))}.amps{grid-template-columns:minmax(0,1fr)}.row{grid-template-columns:minmax(0,1fr) 110px 44px}.row.t{grid-template-columns:minmax(0,1fr) repeat(3,58px)}}
@media(prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<header>
  <div><h1>TOPSIM Spielwiese</h1><div class="sub" id="sub">Unternehmen 1 · Copy Classic · Markt 1</div></div>
  <div class="bar">
    <button id="undo" type="button">Rückgängig</button>
    <button id="setbase" type="button">Als Basis merken</button>
    <button id="reset" type="button">Auf Basis zurück</button>
    <button id="defaults" type="button" title="Formular, Nachrichten und Annahmen auf die Werte aus den Berichten setzen">Neu laden aus Berichten</button>
  </div>
</header>
<p class="msg" id="msg"></p>
<main>
  <div class="form" id="form"></div>
  <div class="res">
    <div class="hero">
      <div class="big"><div class="k" id="pueK">Periodenüberschuss (Plan)</div><div class="v" id="pue"></div><div class="d" id="pueD"></div>
        <div class="trio"><div>Kasse Ende<b id="kasse"></b></div><div>EK-Rendite<b id="ekr"></b></div><div>Absatz<b id="abs"></b></div></div></div>
      <div id="meters"></div>
    </div>
    <div class="card"><h3>Wenn die Nachfrage anders kommt</h3><div class="scroll"><table class="sc" id="scen"></table></div>
      <p class="note" id="scenN"></p></div>
    <div class="amps" id="amps"></div>
    <div class="card"><h3 id="lastH">Was hat sich geändert?</h3><ul class="chg-list" id="last"></ul><p class="note" id="lastN">Ändere ein Feld im Formular – hier erscheint, was es bewirkt (gegenüber dem Stand direkt davor).</p></div>
    <div class="card"><h3>Planwerte für TOPSIM</h3><div class="pw" id="pw"></div><p class="note"><button id="copy" type="button" style="min-height:36px;margin-top:8px">Planwerte kopieren</button> <span id="copied"></span></p></div>
    <div class="card">
      <div class="tabs" role="tablist" id="tabs">
        <button role="tab" data-t="kpi" aria-selected="true">Kennzahlen</button>
        <button role="tab" data-t="wirk">Wirkung je Entscheidung</button>
        <button role="tab" data-t="rech">Planrechnung</button>
        <button role="tab" data-t="aus">Ausblick</button>
        <button role="tab" data-t="bt">Backtest</button>
      </div>
      <div id="tab"></div>
    </div>
  </div>
</main>
<script type="module">
import * as M from './model.js';
import * as DT from './daten.js';

const TY = M.TY;
const FIELDS = [
 ['Vertrieb',[['preis','Preis (pro Stück)','EUR',10],['werbung','Werbung','MEUR',0.5],['vertrieb','Vertrieb (Anz. Pers.)','MA',5],['ci','Corporate Identity','MEUR',0.5],['mf','Marktforschungsbericht','',null]]],
 ['Produktentwicklung',[['tech','Technologie (Anz. Pers.)','MA',1],['oeko','Ökologie','MEUR',0.5],['wa','Wertanalyse','MEUR',0.5],['ga','Großabnehmer','Stück',500],['aus','Ausschreibung (Gebot)','EUR',10]]],
 ['Einkauf',[['einkauf','Einsatzstoffe/Teile','Einh.',1000]]],
 ['Fertigung',[['fm','Fertigungsmenge','Stück',500],'TYPED',['po','Prozessoptimierung','MEUR',0.5],['training','Training je Mitarbeiter','EUR',100],['umwelt','Investition Umweltanlagen','MEUR',0.5],['pnk','Personalnebenkosten','%',1],['pers','Fertigungspersonal Einst./Entl. (−)','MA',10]]],
 ['Finanzen',[['kurz','Kurzfristiger Kredit','MEUR',1],['lang','Langfristiger Kredit','MEUR',1],['wp','Kauf von Wertpapieren','MEUR',1],['div','Dividende','MEUR',0.5]]]];
const TYPED = [['inv','Neue Anlagen (Anzahl)',1],['des1','Desinvestition Anl.-Nr.',1],['des2','Desinvestition Anl.-Nr.',1],['des3','Desinvestition Anl.-Nr.',1],['ih','Instandhaltung je Anlage (MEUR)',0.5],['rat','Rationalisierung je Typ (MEUR)',0.5]];
const NEWS = [['wachstum','Marktwachstum','Anteil',0.01],['bpreis','Branchendurchschnittspreis','EUR',10],['ep1','Einkaufspreis < 30.000','EUR',10],['ep2','Einkaufspreis < 50.000','EUR',10],['ep3','Einkaufspreis < 70.000','EUR',10],['ep4','Einkaufspreis ab 70.000','EUR',10],
 ['nachl','Preis Nachlieferung','EUR',10],['betriebsstoff','Betriebsstoffe je Gerät','EUR',1],['geh_ek','Gehalt Einkauf','EUR',500],['geh_vw','Gehalt Verwaltung','EUR',500],['geh_fe','Gehalt Fertigung','EUR',500],['geh_fue','Gehalt F&E','EUR',500],['geh_vt','Gehalt Vertrieb','EUR',500],
 ['r_kurz','Zins kurzfr. Kredit (vor Rating)','Anteil',0.005],['r_lang','Zins langfr. Kredit (vor Rating)','Anteil',0.005],['r_ue','Zins Überziehung (vor Rating)','Anteil',0.005],['r_wp','Zins Wertpapiere','Anteil',0.005],
 ['ga_preis','Großabnehmer: Preis','EUR',10],['ga_max','Großabnehmer: max. Menge','Stück',500],['aus_menge','Ausschreibung Vorperiode: Zuschlag Menge','Stück',500],['aus_preis','Ausschreibung Vorperiode: Zuschlagspreis','EUR',10]];
const LABEL = {}; FIELDS.forEach(([,fs])=>fs.forEach(f=>{ if(f!=='TYPED') LABEL[f[0]]=f[1]; })); TYPED.forEach(([k,l])=>TY.forEach(t=>LABEL[k+'_'+t]=l+' Typ '+t));

// Was das Modell je Entscheidung rechnet und was nicht (Handbuch)
const WIRK = {
 preis:'Nachfrage über Preis-Absatz-Funktion (Elastizität geschätzt, ±5 % reaktionsarm). Nicht im Modell: Kundenzufriedenheit sinkt bei Preiserhöhung.',
 werbung:'≈ +2.000 Stück je MEUR um 6 MEUR (Handbuch). Nicht im Modell: abnehmender Grenznutzen, Nachwirkung in Folgeperioden, Konkurrenzbudgets.',
 vertrieb:'≈ +200 Stück je MA (Handbuch), Gehalt und Einstellungskosten. Nicht im Modell: Nachwirkung.',
 ci:'Nur Kosten. Nicht im Modell: Bekanntheit → Marktanteil (langfristig, Handbuch ≈ 3 MEUR angemessen).',
 mf:'0,1 MEUR. Liefert Konkurrenzdaten für die Nachfrageschätzung.',
 tech:'F&E-Gehälter. Nicht im Modell: Technologieindex → Marktanteil, mehr Nacharbeit und Einkaufspersonal.',
 oeko:'Nur Kosten. Nicht im Modell: Ökologieindex → Marktanteil, mehr Nacharbeit.',
 wa:'Nur Kosten. Wirkung über Annahme „Wertanalyseindex“ (weniger Einsatzstoffe je Gerät), mehr Nacharbeit nicht im Modell.',
 ga:'Umsatz zum Großabnehmerpreis, Lieferung vor Markt 1, ohne Transportkosten, Zahlung sofort.',
 aus:'Wirkt erst nächste Periode (Lieferung und Zahlung). Niedrigstes Gebot gewinnt.',
 einkauf:'Staffelpreis, Nachlieferung +20 % bei Fehlmenge, Lagerkosten 50 EUR je Einheit.',
 fm:'Kapazität, Überstunden (+2,5 MEUR Zusatzschicht über 100 %), Lager, Herstellkosten je Stück. Nicht im Modell: mehr Nacharbeit bei Überstunden.',
 inv:'Kapazität sofort, AfA, Fixkosten, Umweltindex, Auszahlung sofort.',
 des:'Resterlös 20/25/30 % des Restbuchwerts, außerordentliche AfA, Umweltindex.',
 ih:'Verfügbarkeitsgrad nach Handbuchtabelle (S. 22).',
 rat:'Nur Kosten. Wirkung über Annahme „Rationalisierungsfaktor“ (Höhe je MEUR unbekannt, wirkt dauerhaft).',
 po:'Produktivität +4 % bei 2,5 MEUR (Handbuch, Annahme änderbar). Nicht im Modell: mehr Fehlzeiten.',
 training:'Nur Kosten. Nicht im Modell: Qualifikation → Produktivität, weniger Fehlzeiten (über Annahme „Sonstige Produktivitätsänderung“).',
 umwelt:'Umweltindikator ↑, Umweltabgabe ↓, AfA über 10 Perioden. Nicht im Modell: Kundenzufriedenheit, Fehlzeiten.',
 pnk:'Personalnebenkosten aller Mitarbeiter. Nicht im Modell: weniger Fluktuation, Fehlzeiten, Nacharbeit.',
 pers:'Personalkapazität, Einstellungs-/Entlassungskosten, Sozialplan. Nicht im Modell: Einarbeitung und Motivation.',
 kurz:'Kasse und Zinsen, Rückzahlung nächste Periode.',
 lang:'10 Perioden, nicht tilgbar, Zins fest.',
 wp:'Zinsertrag, Rückfluss nächste Periode.',
 div:'Höchstens Gewinnvortrag. Nicht im Modell: Aktienkurs ↑, Rating ↓ bei Kreditfinanzierung.'
};

let PER, D, S;       // alle Perioden, aktuelle Datenbasis, Zustand
const KEY = 'topsim-spielwiese-v2';
const nf=(x,d=0)=>(x==null||isNaN(x)||!isFinite(x))?'–':x.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const sg=(x,d=0)=>(x>0?'+':x<0?'−':'±')+nf(Math.abs(x),d);
const pct=(x,d=1)=>nf(x*100,d)+' %';
const $=id=>document.getElementById(id);
const grp=g=>g==='form'?S.F:g==='an'?S.A:S.Q;

function defaults(){ const B=D.B; return {F:M.formAus(B),A:M.kalibriere(B),Q:{...(D.prognose||{})}}; }
function fresh(){ const d=defaults(); return {per:D.periode,F:d.F,A:d.A,Q:d.Q,base:null,last:null,undo:[]}; }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify({per:S.per,F:S.F,A:S.A,Q:S.Q,base:S.base})); }catch(e){} }
function load(){ try{ const j=JSON.parse(localStorage.getItem(KEY)); if(!j||j.per!==D.periode) return null; const d=defaults();
  return {per:j.per,F:{...d.F,...j.F},A:{...d.A,...j.A},Q:{...d.Q,...j.Q},base:j.base,last:null,undo:[]}; }catch(e){ return null; } }
const calc=(F=S.F,A=S.A,Q=S.Q)=>M.modell(D.B,F,A,Q);
const baseOf=()=>S.base||defaults();

function inp(g,key,step,val){ if(step===null){ const opts=['Ja','Nein']; return `<select id="${g}-${key}" data-g="${g}" data-k="${key}">${opts.map(o=>`<option${o===val?' selected':''}>${o}</option>`).join('')}</select>`; }
  return `<input id="${g}-${key}" data-g="${g}" data-k="${key}" type="number" inputmode="decimal" step="${step}" value="${val==null?'':val}">`; }
function renderForm(){
  let h='';
  for(const [sec,fs] of FIELDS){
    h+=`<section><h2>${sec}</h2>`;
    for(const f of fs){
      if(f==='TYPED'){ h+=`<div class="row t head"><span>Fertigungsanlagen</span>${TY.map(t=>`<span style="text-align:center">Typ ${t}</span>`).join('')}</div>`;
        for(const [k,l,st] of TYPED) h+=`<div class="row t"><label>${l}</label>${TY.map(t=>inp('form',k+'_'+t,st,S.F[k+'_'+t])).join('')}</div>`; continue; }
      const [k,l,u,st]=f; h+=`<div class="row"><label for="form-${k}">${l}</label>${inp('form',k,st,S.F[k])}<span class="u">${u}</span></div>`;
    }
    h+='</section>';
  }
  h+=`<details><summary>Wirtschaftsnachrichten P${D.periode+1}</summary>${NEWS.map(([k,l,u,st])=>`<div class="row"><label for="pp-${k}">${l}</label>${inp('pp',k,st,S.Q[k])}<span class="u">${u}</span></div>`).join('')}
   <p class="note" style="padding:0 12px">Anteile als Dezimalzahl (0,05 = 5 %). Zinsen ohne Ratingeffekt, der wird automatisch addiert.</p></details>`;
  h+=`<details><summary>Annahmen (aus Berichten kalibriert)</summary>${Object.entries(M.ANNAHMEN).map(([k,[l,u,st,src]])=>`<div class="row"><label for="an-${k}">${l}<span class="src${/Schätzung/.test(src)?' est':''}">${src}</span></label>${inp('an',k,st,S.A[k])}<span class="u">${u}</span></div>`).join('')}
   <p class="note" style="padding:0 12px">Gelb = Schätzung ohne Datengrundlage. Wie stark das Ergebnis an jeder Annahme hängt, zeigt der Reiter „Wirkung je Entscheidung“.</p></details>`;
  $('form').innerHTML=h; markChanged();
}

function status(r,sc){
  const R=M.R,F=S.F,Q=S.Q,a={};
  a.anl=[r.ausl_anl>1+R.ues_anl?'R':(r.ausl_anl>R.a_ausl_gelb||r.ausl_anl<R.a_ausl_unter?'Y':'G'),'Anlagen',`Auslastung ${pct(r.ausl_anl)}`+(r.ausl_anl>1+R.ues_anl?` – nicht produzierbar, Fehlmenge ${nf(Math.max(0,r.fm_plan-r.kap_ues))} Stück`:r.ausl_anl>1?' – Überstunden: +2,50 MEUR Zusatzschicht':r.ausl_anl<R.a_ausl_unter?' – Unterauslastung':'')+(TY.some(t=>r['n_'+t]>0&&(+F['ih_'+t]||0)<0.1)?' · Instandhaltung fehlt (50 %)':'')];
  a.pers=[r.ausl_pers>1+R.ues_pers?'R':(r.ausl_pers>1||r.ausl_pers<R.a_ausl_unter?'Y':'G'),'Personal',`Auslastung ${pct(r.ausl_pers)}`+(r.ausl_pers>1+R.ues_pers?` – ca. ${nf((r.fm_plan-r.pers_kap_ues)/r.prod)} MA fehlen`:r.ausl_pers>1?` – Überstunden ${nf(r.ot_ma,1)} MA`:r.ausl_pers<R.a_ausl_unter?` – ca. ${nf(r.einsetzbar-r.fm_plan/r.prod)} MA zu viel`:'')];
  a.es=[r.nachl>0?'R':(r.es_end>R.a_es_end*r.bedarf?'Y':'G'),'Einsatzstoffe',r.nachl>0?`Nachlieferung ${nf(r.nachl)} Einh. (Mehrkosten ${nf(r.nachl_mehr,2)} MEUR)`:`Endbestand ${nf(r.es_end)} Einh.`+(r.es_end>R.a_es_end*r.bedarf?' – hoch':'')];
  const gaf=(+F.ga||0)>0&&!(+Q.ga_preis>0), gam=(+F.ga||0)>r.ga_max;
  a.lief=[r.ngn>0||gaf||gam?'R':(r.fe_end>R.a_fe_end*r.fe_abg||Math.abs(r.dev)>R.band?'Y':'G'),'Lieferfähigkeit',(gaf?'Großabnehmerpreis fehlt · ':'')+(gam?`Großabnehmer max. ${nf(r.ga_max)} Stück · `:'')+(r.ngn>0?`Fehlmenge ${nf(r.ngn)} Stück`:`lieferfähig, Endbestand ${nf(r.fe_end)} Stück`)+(Math.abs(r.dev)>R.band?' · Preis außerhalb ±5 % (Schätzung unsicher)':'')];
  a.kasse=[r.ueberz>0?'R':(r.kasse>R.a_kasse_max||(+F.kurz||0)>r.ek_vp?'Y':'G'),'Kasse',r.ueberz>0?`Überziehung ${nf(r.ueberz,2)} MEUR – Kredit +${nf(r.kreditbedarf,2)} MEUR nötig`:`Ende ${nf(r.kasse,2)} MEUR`+(r.kasse>R.a_kasse_max?' – mehr Kredit als nötig':'')+((+F.kurz||0)>r.ek_vp?' · Kredit über EK':'')];
  a.pue=[r.pue<0?'R':(r.pue<r.pue_vp||(+F.div||0)>r.div?'Y':'G'),'Periodenüberschuss',`${nf(r.pue,2)} MEUR (Vorperiode ${nf(r.pue_vp,2)})`+((+F.div||0)>r.div?' · Dividende begrenzt':'')];
  a.ekq=[r.ekq<R.a_ekq_rot?'R':(r.ekq<R.a_ekq_gelb?'Y':'G'),'EK-Quote',pct(r.ekq)];
  a.umw=[r.umw_ind<R.a_umw_rot?'R':(r.umw_ind<R.umw_norm?'Y':'G'),'Umwelt',`Indikator ${nf(r.umw_ind,2)}`+(r.umw_ind<R.umw_norm?` – Abgabe ${nf(r.umw_abg,2)} MEUR`:' – Norm erfüllt')];
  const p=sc.pess,o=sc.opt, rp=[];
  if(p.ueberz>0&&r.ueberz===0) rp.push(`pessimistisch Überziehung ${nf(p.ueberz,2)} MEUR`);
  if(o.ngn>0&&r.ngn===0) rp.push(`optimistisch Fehlmenge ${nf(o.ngn)} Stück`);
  if(p.pue<0&&r.pue>=0) rp.push('pessimistisch Verlust');
  a.rob=[rp.length?'Y':'G','Robustheit',rp.length?rp.join(' · '):`hält bei Nachfrage ±${pct(+S.A.unsicherheit||0,0)}`];
  return a;
}

const GOOD={nachfrage:1,absatz:1,umsatz:1,hk_stk:-1,sk_stk:-1,k_sum:-1,be:1,pue:1,ekr:1,ocf:1,kasse:1,ueberz:-1,ekq:1,umw_abg:-1,ngn:-1};

const KPI=[['nachfrage','Nachfrage (Schätzung)','Stück',0],['absatz','Absatz Markt 1','Stück',0],['umsatz','Umsatz','MEUR',2],['fert_ist','Fertigung','Stück',0],['ausl_anl','Auslastung Anlagen','%',1],['ausl_pers','Auslastung Personal','%',1],
 ['prod','Produktivität je MA','Stück',2],['hk_stk','Herstellkosten je Stück','EUR',2],['sk_stk','Selbstkosten je Stück','EUR',2],['k_sum','Kosten gesamt','MEUR',2],['db1','Deckungsbeitrag I','MEUR',2],['be','Betriebsergebnis','MEUR',2],['pue','Periodenüberschuss','MEUR',2],['ekr','EK-Rendite','%',2],
 ['ocf','Operativer Cashflow','MEUR',2],['kasse','Kassenendbestand','MEUR',2],['ueberz','Überziehungskredit','MEUR',2],['ekq','EK-Quote','%',1],['fe_end','Lager Fertigprodukte','Stück',0],['es_end','Lager Einsatzstoffe','Einh.',0],['umw_ind','Umweltindikator','Index',2],['umw_abg','Umweltabgabe','MEUR',2],['pers_gesamt','Personal gesamt','MA',0]];
const fmtK=(v,u,d)=>u==='%'?pct(v,d):nf(v,d)+(u==='MEUR'?' MEUR':'');
const dK=(v,u,d)=>u==='%'?sg(v*100,d)+' %-P.':sg(v,d);
let cur, base, sc, tabSel='kpi';

function render(){

  $('meters').innerHTML=meter('Anlagen',cur.ausl_anl,`Kapazität ${nf(cur.kap)} Stück`)+meter('Personal',cur.ausl_pers,`${nf(cur.einsetzbar)} einsetzbare MA × ${nf(cur.prod,2)}`)+`<div class="note">Strich = 100 %, rot = 110 % (Grenze mit Überstunden)</div>`;
  // Szenarien

  $('scen').innerHTML=`<tr><th></th><th>Pessimistisch</th><th>Basis</th><th>Optimistisch</th></tr>`+SR.map(([l,k,u,d])=>`<tr><td>${l}</td>${S3.map(r=>`<td>${fmtK(r[k],u,d)}</td>`).join('')}</tr>`).join('')+
    `<tr><td>Planungsqualität, wenn es so kommt</td>${S3.map(r=>`<td>${nf(M.planungsqualitaet(pl,{absatz:r.absatz,ekr:r.ekr,ocf:r.ocf}).gesamt,1)}</td>`).join('')}</tr>`;
  $('scenN').textContent=`Nachfrage ±${pct(+S.A.unsicherheit||0,0)} um die Schätzung (Annahme „Unsicherheit“). Gute Entscheidungen halten in allen drei Spalten: keine Überziehung, kein großer Lagerberg, keine Fehlmenge. Planwerte unten gelten für die Basis.`;
  const a=status(cur,sc);
  $('amps').innerHTML=Object.values(a).map(([s,l,m])=>`<div class="amp ${s}"><b>${{R:'ROT',Y:'GELB',G:'GRÜN'}[s]} · ${l}</b>${m}</div>`).join('');
  const L=S.last;

    $('lastH').textContent=`Was hat sich geändert? ${L.label}: ${L.from} → ${L.to}`;
    const items=KPI.map(([k,l,u,d])=>[l,cur[k]-before[k],u,d,k]).filter(x=>Math.abs(x[1])>(x[2]==='%'?0.0005:x[3]===0?0.5:0.005));
    $('last').innerHTML=items.length?items.map(([l,v,u,d,k])=>`<li><span>${l}</span><b class="${cls(k,v)}">${dK(v,u,d)}</b></li>`).join(''):'<li><span class="mute">keine Wirkung auf die Kennzahlen im Modell</span></li>';

  renderTab(); save();
}

// ---------- Reiter ----------
function renderTab(){
  const el=$('tab');
  if(tabSel==='kpi') el.innerHTML=`<div class="scroll"><table><tr><th>Kennzahl</th><th>Basis</th><th>Jetzt</th><th>Δ</th></tr>`+KPI.map(([k,l,u,d])=>{const v=cur[k]-base[k];return `<tr><td>${l}</td><td>${fmtK(base[k],u,d)}</td><td><b>${fmtK(cur[k],u,d)}</b></td><td class="${cls(k,v)}">${Math.abs(v)<1e-6?'–':dK(v,u,d)}</td></tr>`;}).join('')+`</table></div>
    <p class="note">Grün = besser, rot = schlechter. Basis = Vorbelegung aus den Berichten bzw. „Als Basis merken“.</p>`;
  if(tabSel==='wirk') el.innerHTML=wirkung();
  if(tabSel==='rech') el.innerHTML=rechnung(cur);
  if(tabSel==='aus') el.innerHTML=ausblickHtml();
  if(tabSel==='bt') el.innerHTML=backtestHtml();
}

function wirkung(){
  const r0=cur, a0=M.ausblick(D.B,S.F,S.A,S.Q,r0).r;
  const cols=[['absatz','Absatz',0],['umsatz','Umsatz',2],['pue','PÜ',2],['kasse','Kasse',2],['ausl_anl','Ausl. Anl.',1,'%'],['ausl_pers','Ausl. Pers.',1,'%'],['hk_stk','HK/Stück',0]];
  const row=(label,stepTxt,r1,a1,note)=>`<tr><td>${label}${note?`<span class="src">${note}</span>`:''}</td><td>${stepTxt}</td>${cols.map(([k,,d,u])=>{const v=r1[k]-r0[k];return `<td class="${cls(k,v)}">${Math.abs(v)<1e-6?'·':u==='%'?sg(v*100,d):sg(v,d)}</td>`;}).join('')}<td class="${cls('pue',a1.pue-a0.pue)}">${Math.abs(a1.pue-a0.pue)<1e-6?'·':sg(a1.pue-a0.pue,2)}</td></tr>`;
  const head=(extra)=>`<tr><th>Feld</th><th>Schritt</th>${cols.map(c=>`<th>Δ ${c[1]}</th>`).join('')}<th>Δ PÜ P${D.periode+2}</th></tr>`;
  let h=`<p class="note">Jede Zeile: dieses eine Feld um einen Schritt erhöht, alles andere wie jetzt. Letzte Zahlenspalte: Wirkung auf den Periodenüberschuss der Periode danach (gleiche Entscheidungen wiederholt).</p><div class="scroll"><table>${head(true)}`;
  const fields=[]; FIELDS.forEach(([,fs])=>fs.forEach(f=>{ if(f==='TYPED') TYPED.filter(x=>!/^des/.test(x[0])).forEach(([k,,st])=>TY.forEach(t=>fields.push([k+'_'+t,st,k]))); else if(f[3]!==null) fields.push([f[0],f[3],f[0]]); }));
  for(const [k,st,wk] of fields){
    if(/_[BC]$/.test(k)&&!(+S.F[k]>0)&&!cur['n_'+k.slice(-1)]&&!/^inv/.test(k)) continue;
    const F1={...S.F,[k]:(+S.F[k]||0)+st}; const r1=calc(F1); const a1=M.ausblick(D.B,F1,S.A,S.Q,r1).r;
    h+=row(LABEL[k],sg(st,st<1?1:0),r1,a1,/_[BC]$/.test(k)&&!/^inv/.test(k)?'':WIRK[wk]||'');
  }
  h+=`</table></div><h3 style="margin:18px 0 6px;font-size:15px">Annahmen: wie stark hängt das Ergebnis daran?</h3><div class="scroll"><table>${head(true)}`;
  for(const [k,[l,u,st,src]] of Object.entries(M.ANNAHMEN)){
    if(st==null||k==='absatz_manuell'||k==='unsicherheit') continue;
    const A1={...S.A,[k]:(S.A[k]==null||S.A[k]===''?(k==='r_lang_alt'?+S.Q.r_lang:0):+S.A[k])+st}; const r1=calc(S.F,A1); const a1=M.ausblick(D.B,S.F,A1,S.Q,r1).r;
    h+=row(l,sg(st,st<1?3:0),r1,a1,src);
  }
  { const A1={...S.A,absatz_manuell:cur.nachfrage+1000}; const r1=calc(S.F,A1); const a1=M.ausblick(D.B,S.F,A1,S.Q,r1).r; h+=row('Nachfrage','+1.000',r1,a1,'Wichtigste Unsicherheit – siehe Szenarien oben'); }
  return h+'</table></div>';
}

function rechnung(r){
  const z=(l,v,c='')=>`<tr class="${c}"><td>${l}</td><td>${nf(v,2)}</td></tr>`;
  const kost=M.KOSTEN.map(([k,l])=>z(l,r[k])).join('')+z('Summe',r.k_sum,'sum');
  const guv=z('Umsatzerlöse',r.umsatz)+z('± Bestandsveränderung',r.bestv)+z('− Materialaufwand',r.g_mat)+z('− Personalaufwand',r.g_pers)+z('− Abschreibungen',r.g_afa)+z('− Sonstiger Aufwand',r.g_sonst)+z('= Betriebsergebnis',r.be,'sum')+
    z('+ Wertpapiererträge',r.wp_ertr)+z('− Zinsen Kredite',r.zins_kl)+z('− Zinsen Überziehung',r.zins_ue)+z('= Gewinn vor Steuern',r.egt,'sum')+z('− Steuern',r.steuern)+z('= Periodenüberschuss',r.pue,'sum');
  const liq=z('Kassenanfang',r.l_anf)+z('+ Einzahlungen',r.ez)+z('+ Überziehungskredit',r.ueberz)+z('− Auszahlungen (ohne Steuern/Überz.-Zinsen)',r.az)+z('− Steuern',r.steuern)+z('− Zinsen Überziehung',r.zins_ue)+z('= Kassenende',r.kasse,'sum');
  const bil=z('Grundstücke und Bauten',r.bi_grund)+z('Maschinen',r.bi_masch)+z('Materialien',r.es_end_val)+z('Fertige Erzeugnisse',r.fe_end_val)+z('Forderungen',r.bi_ford)+z('Wertpapiere',+S.F.wp||0)+z('Kasse',r.kasse)+z('Aktiva',r.bi_akt,'sum')+
    z('Eigenkapital',r.bi_ek)+z('Pensionsrückstellungen',r.bi_pens)+z('Langfr. Verbindlichkeiten',r.bi_lang)+z('Kurzfr. Verbindlichkeiten',+S.F.kurz||0)+z('Überziehungskredit',r.ueberz)+z('Passiva',r.bi_pas,'sum');
  const anl=`<tr><th>Anlage</th><th>Kapazität</th><th>Verfügb.</th><th>AfA</th><th>RBW Ende</th><th>Fixk.</th><th>Umw.</th></tr>`+r.anl.map((a,i)=>`<tr><td>Typ ${a.t}${a.neu?' (neu)':''}</td><td>${nf(a.kap)}</td><td>${pct(a.ihf*a.rat,0)}</td><td>${nf(a.afa,2)}</td><td>${nf(a.rbw,2)}</td><td>${nf(a.fix,2)}</td><td>${nf(a.umw,1)}</td></tr>`).join('');
  const per=`<tr><th>Personal</th><th>Anfang</th><th>Fluk.</th><th>Einst.</th><th>Entl.</th><th>Ende</th><th>Kosten</th></tr>`+['Einkauf','Verwaltung','Fertigung','F&E','Vertrieb'].map((l,j)=>{const p=r.P[j];return `<tr><td>${l}</td><td>${nf(p.anf)}</td><td>${nf(p.fl)}</td><td>${nf(p.einst)}</td><td>${nf(p.entl)}</td><td>${nf(p.end)}</td><td>${nf(p.sum,2)}</td></tr>`;}).join('');
  return `<div class="two"><div><h3>Kostenarten (MEUR)</h3><table>${kost}</table></div><div><h3>GuV (MEUR)</h3><table>${guv}</table><h3 style="margin-top:14px">Liquidität (MEUR)</h3><table>${liq}</table></div>
    <div><h3>Planbilanz (MEUR)</h3><table>${bil}</table><p class="note">Bilanzdifferenz ${r.bi_diff.toExponential(1)}</p></div><div><h3>Anlagen</h3><div class="scroll"><table>${anl}</table></div><h3 style="margin-top:14px">Personal</h3><div class="scroll"><table>${per}</table></div></div></div>`;
}

function ausblickHtml(){
  const a=M.ausblick(D.B,S.F,S.A,S.Q,cur), r2=a.r, p1=D.periode+1, p2=D.periode+2;
  const rows=[['Nachfrage (Schätzung)','nachfrage','Stück',0],['Absatz','absatz','Stück',0],['Fertigung','fert_ist','Stück',0],['Auslastung Anlagen','ausl_anl','%',1],['Auslastung Personal','ausl_pers','%',1],['Herstellkosten je Stück','hk_stk','EUR',2],['Kosten gesamt','k_sum','MEUR',2],['AfA gesamt','g_afa','MEUR',2],['Betriebsergebnis','be','MEUR',2],['Zinsen','zins_kl','MEUR',2],['Periodenüberschuss','pue','MEUR',2],['Kasse Ende','kasse','MEUR',2],['Überziehungskredit','ueberz','MEUR',2],['Eigenkapital','bi_ek','MEUR',2],['EK-Rendite','ekr','%',2],['Umweltabgabe','umw_abg','MEUR',2]];
  return `<p class="note">P${p2}: dieselben Entscheidungen noch einmal (ohne neue Anlagen oder Desinvestitionen), Wirtschaftsnachrichten und Annahmen wie P${p1}, Nachfrage aus dem Modell. Zeigt Folgewirkungen: Kreditrückzahlung, Forderungen, Lager, AfA, Personalstand, Gewinnvortrag.</p>
   <div class="scroll"><table><tr><th>Kennzahl</th><th>P${p1}</th><th>P${p2}</th></tr>${rows.map(([l,k,u,d])=>`<tr><td>${l}</td><td>${fmtK(cur[k],u,d)}</td><td>${fmtK(r2[k],u,d)}</td></tr>`).join('')}</table></div>`;
}

function backtestHtml(){
  const i=PER.indexOf(D), bt=DT.backtest(PER,i,true);
  let h=`<p class="note">Periode ${D.periode} mit unseren tatsächlichen Entscheidungen (TNB19) und dem tatsächlichen Absatz nachgerechnet und mit dem Sammelbericht verglichen. ${bt.inSample?'<b>Achtung P0:</b> Die Annahmen stammen aus derselben Periode, der Test prüft also nur die Rechenlogik. Ab P1 ist es ein echter Test.':'Die Annahmen stammen aus der Vorperiode – so wie bei der Planung.'}</p>`;
  if(i>0){ const bn=DT.backtest(PER,i,false); const ist=+D.B.t01_absatz?.[0]; h+=`<p class="note"><b>Nachfrageschätzung:</b> Modell ${nf(bn.r.nachfrage)} Stück, tatsächlich ${nf(ist)} Stück (${sg(100*(bn.r.nachfrage/ist-1),1)} %).</p>`; }
  const tol=u=>u==='MEUR'?0.05:u==='EUR'?5:u==='%'?0.2:1;
  h+=`<div class="scroll"><table><tr><th>Position</th><th>Modell</th><th>Ist</th><th>Δ</th></tr>`+bt.zeilen.map(([l,u,m,ist,d])=>{const dv=m-ist;return `<tr class="${Math.abs(dv)>tol(u)?'bad':''}"><td>${l}</td><td>${nf(m,d)}</td><td>${nf(ist,d)}</td><td>${sg(dv,d)}</td></tr>`;}).join('')+'</table></div>';
  const c=DT.konsistenz(D.B), bad=c.filter(x=>!x.ok);
  h+=`<p class="note"><b>Prüfung der Berichtsdaten:</b> ${c.length-bad.length} von ${c.length} Rechenprüfungen bestanden${bad.length?' – fehlgeschlagen: '+bad.map(x=>x.name).join(', '):''}.</p>`;
  return h;
}

// ---------- Bedienung ----------
function markChanged(){ const B=baseOf();
  document.querySelectorAll('#form [data-k]').forEach(el=>{const g=el.dataset.g,k=el.dataset.k,bv={form:B.F,an:B.A,pp:B.Q}[g][k]; el.classList.toggle('chg',String(bv??'')!==String(grp(g)[k]??''));}); }
const label=el=>{const row=el.closest('.row'); const lb=row.querySelector('label'); const l=(lb.childNodes[0]?.textContent||lb.textContent).trim(); const t=el.dataset.k.match(/_([ABC])$/); return t&&el.closest('.t')?`${l} Typ ${t[1]}`:l;};
let focusSnap=null;
const form=$('form');
const fmtV=v=>v==null?'leer':typeof v==='number'?nf(v,3).replace(/,?0+$/,''):v;
form.addEventListener('focusin',e=>{const el=e.target; if(!el.dataset.k) return; focusSnap={el,val:grp(el.dataset.g)[el.dataset.k],res:calc()};});
form.addEventListener('input',e=>{const el=e.target; if(!el.dataset.k) return; const g=el.dataset.g,k=el.dataset.k;
  if(!focusSnap||focusSnap.el!==el) focusSnap={el,val:grp(g)[k],res:calc()};
  const v=el.tagName==='SELECT'?el.value:(el.value===''?null:+el.value); grp(g)[k]=v;
  S.last={label:label(el),from:fmtV(focusSnap.val),to:fmtV(v),res:focusSnap.res,g,k,old:focusSnap.val};
  markChanged(); render();});
form.addEventListener('change',e=>{ if(S.last&&focusSnap&&focusSnap.el===e.target){ S.undo.push({g:S.last.g,k:S.last.k,v:S.last.old}); focusSnap={el:e.target,val:grp(S.last.g)[S.last.k],res:calc()}; }});
$('undo').onclick=()=>{const u=S.undo.pop(); if(!u) return; const before=calc(); const now=grp(u.g)[u.k]; grp(u.g)[u.k]=u.v; const el=$(u.g+'-'+u.k); if(el) el.value=u.v??''; S.last={label:'Rückgängig '+(el?label(el):u.k),from:fmtV(now),to:fmtV(u.v),res:before,k:u.k}; markChanged(); render();};
$('setbase').onclick=()=>{S.base={F:{...S.F},A:{...S.A},Q:{...S.Q}}; markChanged(); render(); flash('Aktuelle Eingaben sind jetzt die Basis für den Vergleich.');};
$('reset').onclick=()=>{const B=baseOf(); S.F={...B.F};S.A={...B.A};S.Q={...B.Q};S.last=null;S.undo=[]; renderForm(); clearLast(); render();};
$('defaults').onclick=()=>{ if(!confirm('Alle Eingaben auf die Werte aus den Berichten zurücksetzen? Die gemerkte Basis wird gelöscht.')) return; S=fresh(); renderForm(); clearLast(); render(); flash('Formular, Nachrichten und Annahmen neu aus den Berichten geladen.');};
function clearLast(){ $('last').innerHTML=''; $('lastN').textContent='Ändere ein Feld im Formular – hier erscheint, was es bewirkt (gegenüber dem Stand direkt davor).'; $('lastN').style.display=''; $('lastH').textContent='Was hat sich geändert?'; }
$('copy').onclick=async()=>{const t=`Umsatz Markt 1: ${nf(cur.umsatz_m1,2)} MEUR\nEK-Rendite: ${nf(cur.ekr*100,2)} %\nOperativer Cashflow: ${nf(cur.ocf,2)} MEUR\nGeplanter Absatz: ${nf(cur.absatz)} Stück`;
  try{await navigator.clipboard.writeText(t); $('copied').textContent='kopiert';}catch(e){$('copied').textContent='Kopieren nicht erlaubt – bitte abschreiben';}};
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; tabSel=b.dataset.t; document.querySelectorAll('#tabs button').forEach(x=>x.setAttribute('aria-selected',x===b)); renderTab();});
function flash(t){const m=$('msg'); m.textContent=t; m.style.display='block'; clearTimeout(flash.t); flash.t=setTimeout(()=>m.style.display='none',6000);}

async function start(){
  try{
    const idx=await (await fetch('data/index.json',{cache:'no-store'})).json();
    const files=await Promise.all(idx.perioden.map(async n=>(await fetch(`data/p${n}.json`,{cache:'no-store'})).json()));
    PER=DT.bereite(files); D=PER[PER.length-1];
  }catch(e){ flash('Daten konnten nicht geladen werden ('+e.message+'). Die Seite muss über GitHub Pages oder einen Webserver laufen, nicht als Datei.'); return; }
  const saved=load(); S=saved||fresh();
  if(!saved&&localStorage.getItem(KEY)) flash(`Neue Berichte für Periode ${D.periode} geladen – Formular ist mit den Entscheidungen aus TNB19 vorbelegt.`);
  renderForm(); render();
}
start();
</script>
</body>
</html>
